# CODEMIND isolated Windows verification, no repository execution permissions.
name: CODEMIND Windows Slice
on:
  pull_request:
    paths:
      - "src/serena/codemind/**"
      - "src/serena/mcp.py"
      - "src/serena/tools/codemind_tools.py"
      - "test/serena/test_codemind_guard.py"
      - ".github/workflows/codemind-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-and-module-regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile changed Python modules
        shell: pwsh
        run: |
          python -m py_compile src/serena/mcp.py src/serena/codemind/learning.py src/serena/codemind/modules.py src/serena/tools/codemind_tools.py test/serena/test_codemind_guard.py
      - name: Install isolated test framework
        shell: pwsh
        run: python -m pip install pytest
      - name: Run persistent-guard and JSON skills tests
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python -m pytest -q test/serena/test_codemind_guard.py
