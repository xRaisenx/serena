# CODEMIND isolated Windows verification, no repository execution permissions.
name: CODEMIND Windows Slice
on:
  pull_request:
    paths:
      - "src/serena/codemind/**"
      - ".codex/hooks.json"
      - ".codex/hooks/**"
      - "test/serena/test_codemind_hooks.cjs"
      - "test/serena/test_scc_brand.cjs"
      - "test/serena/test_scc_operator_workflows.cjs"
      - "test/serena/test_scc_commander.cjs"
      - "tools/scc_commander/**"
      - "scripts/start-scc-commander.ps1"
      - "src/serena/mcp.py"
      - "src/serena/dashboard.py"
      - "src/serena/resources/dashboard/codemind/**"
      - "src/serena/tools/codemind_tools.py"
      - "test/serena/test_codemind_*.py"
      - ".github/workflows/codemind-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-and-module-regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile changed Python modules
        shell: pwsh
        run: |
          python -m py_compile src/serena/mcp.py src/serena/codemind/learning.py src/serena/codemind/modules.py src/serena/codemind/planner.py src/serena/codemind/health.py src/serena/codemind/tunnel_control.py src/serena/codemind/dashboard_api.py src/serena/codemind/read_model.py src/serena/codemind/futures.py src/serena/codemind/methods.py src/serena/dashboard.py src/serena/tools/codemind_tools.py test/serena/test_codemind_guard.py test/serena/test_codemind_guard_concurrency.py test/serena/test_codemind_health.py test/serena/test_codemind_registry.py test/serena/test_codemind_dashboard.py test/serena/test_codemind_v2.py test/serena/test_codemind_tunnel_control.py test/serena/test_codemind_mvp_futures.py test/serena/test_codemind_skill_pack.py
      - name: Install isolated test framework
        shell: pwsh
        run: python -m pip install pytest
      - name: Run persistent-guard and JSON skills tests
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python -m pytest --noconftest -q test/serena/test_codemind_guard.py test/serena/test_codemind_guard_concurrency.py test/serena/test_codemind_health.py test/serena/test_codemind_tunnel_control.py
      - uses: astral-sh/setup-uv@v5
      - name: SCC Commander preflight on Windows PowerShell 5.1
        shell: pwsh
        run: |
          $out = & "$env:WINDIR\\System32\\WindowsPowerShell\\v1.0\\powershell.exe" -NoProfile -NonInteractive -File scripts/start-scc-commander.ps1 -CheckOnly 2>&1
          if ($LASTEXITCODE -ne 0 -or -not ($out -match 'SCC_COMMANDER_PREFLIGHT_PASS')) { throw "SCC Commander PowerShell 5.1 preflight failed: $out" }
      - name: Launcher preflight on Windows PowerShell 5.1
        shell: pwsh
        run: |
          $out = & "$env:WINDIR\\System32\\WindowsPowerShell\\v1.0\\powershell.exe" -NoProfile -NonInteractive -File scripts/start-codemind-serena.ps1 -CheckOnly 2>&1
          if ($LASTEXITCODE -ne 0 -or -not ($out -match 'CODEMIND_LAUNCHER_PREFLIGHT_PASS')) { throw "PowerShell 5.1 launcher preflight failed: $out" }
          Write-Output "PS51_LAUNCHER_PREFLIGHT_PASS"
      - name: Launcher preflight on PowerShell 7
        shell: pwsh
        run: |
          $out = & pwsh -NoProfile -NonInteractive -File scripts/start-codemind-serena.ps1 -CheckOnly 2>&1
          if ($LASTEXITCODE -ne 0 -or -not ($out -match 'CODEMIND_LAUNCHER_PREFLIGHT_PASS')) { throw "PowerShell 7 launcher preflight failed: $out" }
          Write-Output "PS7_LAUNCHER_PREFLIGHT_PASS"
      - name: Install pinned Serena runtime for actual tool integration
        shell: pwsh
        run: uv sync --extra dev --locked
      - name: Run Serena MCP registration and tool dispatch integration tests
        shell: pwsh
        run: uv run --no-sync python -m pytest -q test/serena/test_codemind_registry.py test/serena/test_codemind_dashboard.py test/serena/test_codemind_v2.py test/serena/test_codemind_mvp_futures.py test/serena/test_codemind_skill_pack.py test/serena/test_mcp.py
      - name: Verify real subprocess MCP handshake tool discovery and call
        shell: pwsh
        run: uv run --no-sync python -m pytest -q test/serena/test_codemind_stdio.py
      - name: Verify all CODEMIND Codex lifecycle hooks on Windows
        shell: pwsh
        run: |
          node --check .codex/hooks/codemind-hooks.cjs
          node --test test/serena/test_codemind_hooks.cjs
          node --test test/serena/test_codemind_method_badges.cjs
          node --test test/serena/test_scc_brand.cjs
          node --test test/serena/test_scc_operator_workflows.cjs
          node --check tools/scc_commander/server.cjs
          node --test test/serena/test_scc_commander.cjs
      - name: Check Codex project hook registry JSON
        shell: pwsh
        run: |
          $config = Get-Content .codex/hooks.json -Raw | ConvertFrom-Json
          if (@($config.hooks.PSObject.Properties).Count -ne 11) { throw 'Expected 11 hook events' }
          Write-Host 'CODEMIND_11_HOOKS_CONFIGURED'
      - name: Check dashboard JavaScript syntax
        shell: pwsh
        run: node --check src/serena/resources/dashboard/codemind/console.js
